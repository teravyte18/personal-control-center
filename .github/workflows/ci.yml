name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee source-validation.log

      - name: Validate operational scripts
        run: sh -n scripts/backup-postgres.sh scripts/check-production-security.sh scripts/deploy-production.sh scripts/manage-offsite-backup.sh scripts/offsite-backup.sh scripts/restore-offsite.sh scripts/restore-postgres.sh

      - name: Test domain and security behavior
        run: npm test

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a source-validation.log

      - name: Upload source validation failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: source-validation-log
          path: source-validation.log
          if-no-files-found: ignore

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-compose-password
          PCC_DEFAULT_USER_EMAIL: owner@example.test
          PCC_OWNER_BOOTSTRAP_PASSWORD: owner-bootstrap-password-123
          PCC_PUBLIC_URL: http://localhost:3000
          PCC_COOKIE_SECURE: 0
          PCC_BACKUP_INTERVAL_HOURS: 24
          PCC_BACKUP_RETENTION_DAYS: 14
          PCC_R2_ENABLED: 0
          PCC_ALLOW_INSECURE_USER_HEADER: 1
          TAILSCALE_AUTH_KEY: ci-placeholder
          TAILSCALE_HOSTNAME: personal-control-center-ci
        run: |
          docker compose config --quiet
          docker compose --profile funnel config --quiet

      - name: Validate production persistence, authentication, photos, PWA, and backups
        env:
          POSTGRES_PASSWORD: ci-compose-password
          PCC_DEFAULT_USER_EMAIL: owner@example.test
          PCC_OWNER_BOOTSTRAP_PASSWORD: owner-bootstrap-password-123
          PCC_PUBLIC_URL: http://localhost:3000
          PCC_COOKIE_SECURE: 0
          PCC_BACKUP_INTERVAL_HOURS: 24
          PCC_BACKUP_RETENTION_DAYS: 14
          PCC_R2_ENABLED: 0
          PCC_ALLOW_INSECURE_USER_HEADER: 1
        run: |
          set -o pipefail
          sudo rm -rf data/backups data/uploads data/offsite-restore .secrets
          mkdir -p data/backups data/offsite-restore .secrets
          sudo install -d -o 1000 -g 1000 -m 0755 data/uploads
          export PCC_HOST_UID="$(id -u)"
          export PCC_HOST_GID="$(id -g)"
          touch compose-validation.log
          exec > >(tee -a compose-validation.log) 2>&1
          set -x
          trap 'docker compose ps -a; docker compose logs; docker compose down --volumes --remove-orphans; sudo rm -rf data/backups data/uploads data/offsite-restore .secrets; rm -f pwa-manifest.json pwa-icon-* upload-archive.list' EXIT
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          node --test tests/server-persistence.test.mjs

          curl --fail --silent http://127.0.0.1:3000/manifest.webmanifest > pwa-manifest.json
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('pwa-manifest.json', 'utf8'));
          if (manifest.display !== 'standalone') throw new Error('PWA display mode is not standalone.');
          const icons = Array.isArray(manifest.icons) ? manifest.icons : [];
          if (!icons.some((icon) => icon.sizes === '192x192' && icon.type === 'image/png')) throw new Error('Missing 192px PNG icon.');
          if (!icons.some((icon) => icon.sizes === '512x512' && icon.type === 'image/png')) throw new Error('Missing 512px PNG icon.');
          if (!icons.some((icon) => icon.sizes === '512x512' && icon.purpose === 'maskable')) throw new Error('Missing maskable icon.');
          NODE

          for size in 192 512; do
            curl --fail --silent --show-error --dump-header "pwa-icon-$size.headers" --output "pwa-icon-$size.png" "http://127.0.0.1:3000/api/pwa-icon/$size"
            grep -qi '^content-type: image/png' "pwa-icon-$size.headers"
            python3 - "$size" <<'PY'
          import struct
          import sys

          size = int(sys.argv[1])
          with open(f"pwa-icon-{size}.png", "rb") as icon_file:
              header = icon_file.read(24)
          if header[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Generated icon is not a PNG.")
          width, height = struct.unpack(">II", header[16:24])
          if (width, height) != (size, size):
              raise SystemExit(f"Generated icon is {width}x{height}, expected {size}x{size}.")
          PY
          done

          docker compose run --rm backup --once
          latest_dump="$(find data/backups -maxdepth 1 -type f -name 'personal-control-center-*.dump' -size +0c | sort | tail -n 1)"
          latest_uploads="$(find data/backups -maxdepth 1 -type f -name 'personal-control-center-*.uploads.tar.gz' -size +0c | sort | tail -n 1)"
          test -n "$latest_dump"
          test -n "$latest_uploads"
          docker compose exec -T backup pg_restore --list "/backups/$(basename "$latest_dump")" >/dev/null
          tar -tzf "$latest_uploads" > upload-archive.list
          grep -Eq '^\./[^/]+/review-photos/[0-9a-f-]{36}$' upload-archive.list
          docker compose run --rm --no-deps --entrypoint /usr/local/bin/pcc-offsite backup status | grep -q 'R2 off-site backups are disabled'

      - name: Upload Compose failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-validation-log
          path: compose-validation.log
          if-no-files-found: ignore
