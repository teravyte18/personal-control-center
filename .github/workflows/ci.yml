name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Keychain crypto dependency lock
        run: node scripts/check-keychain-dependencies.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee source-validation.log

      - name: Validate operational scripts
        run: sh -n scripts/backup-postgres.sh scripts/check-production-security.sh scripts/deploy-production.sh scripts/manage-offsite-backup.sh scripts/offsite-backup.sh scripts/restore-offsite.sh scripts/restore-postgres.sh

      - name: Verify restore scripts reject root
        run: |
          set -eu
          if sudo sh scripts/manage-offsite-backup.sh status >/tmp/manage-root.log 2>&1; then
            echo "manage-offsite-backup.sh unexpectedly allowed root execution." >&2
            exit 1
          fi
          grep -q 'Do not run this script as root' /tmp/manage-root.log

          if sudo sh scripts/restore-postgres.sh missing.dump >/tmp/restore-root.log 2>&1; then
            echo "restore-postgres.sh unexpectedly allowed root execution." >&2
            exit 1
          fi
          grep -q 'Do not run this restore as root' /tmp/restore-root.log

      - name: Test domain and security behavior
        run: npm test

      - name: Upload source validation failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: source-validation-log
          path: source-validation.log
          if-no-files-found: ignore

  production_stack:
    name: Production stack
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-compose-password
      PCC_DEFAULT_USER_EMAIL: owner@example.test
      PCC_OWNER_BOOTSTRAP_PASSWORD: owner-bootstrap-password-123
      PCC_PUBLIC_URL: http://localhost:3000
      PCC_COOKIE_SECURE: 0
      PCC_BACKUP_INTERVAL_HOURS: 24
      PCC_BACKUP_RETENTION_DAYS: 14
      PCC_R2_ENABLED: 0
      PCC_ALLOW_INSECURE_USER_HEADER: 1
      TAILSCALE_AUTH_KEY: ci-placeholder
      TAILSCALE_HOSTNAME: personal-control-center-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose --profile funnel config --quiet

      - name: Validate production persistence, authentication, photos, PWA, Keychain, and backups
        run: |
          set -o pipefail
          sudo rm -rf data/backups data/uploads data/offsite-restore .secrets
          mkdir -p data/backups data/offsite-restore .secrets
          sudo install -d -o 1000 -g 1000 -m 0755 data/uploads
          export PCC_HOST_UID="$(id -u)"
          export PCC_HOST_GID="$(id -g)"
          touch compose-validation.log
          exec > >(tee -a compose-validation.log) 2>&1
          set -x
          trap 'docker compose ps -a; docker compose logs; docker compose down --volumes --remove-orphans; sudo rm -rf data/backups data/uploads data/offsite-restore .secrets; rm -f pwa-manifest.json pwa-icon-* pwa-static-* upload-archive.list keychain-page.headers' EXIT
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          node --test tests/server-persistence.test.mjs
          node --test tests/keychain-server.test.mjs
          node --test tests/keychain-stage3-server.test.mjs

          curl --fail --silent --show-error --dump-header keychain-page.headers --output /dev/null -H 'x-pcc-user-email: owner@example.test' http://127.0.0.1:3000/keychain
          grep -Eqi '^cache-control:.*private.*no-store' keychain-page.headers
          grep -Eqi '^content-security-policy:.*default-src .self.*object-src .none.*frame-ancestors .none' keychain-page.headers
          grep -Eqi '^referrer-policy:.*no-referrer' keychain-page.headers
          grep -Eqi '^x-frame-options:.*deny' keychain-page.headers

          curl --fail --silent http://127.0.0.1:3000/manifest.webmanifest > pwa-manifest.json
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('pwa-manifest.json', 'utf8'));
          if (manifest.display !== 'standalone') throw new Error('PWA display mode is not standalone.');
          const icons = Array.isArray(manifest.icons) ? manifest.icons : [];
          if (!icons.some((icon) => icon.sizes === '192x192' && icon.type === 'image/png')) throw new Error('Missing 192px PNG icon.');
          if (!icons.some((icon) => icon.sizes === '512x512' && icon.type === 'image/png')) throw new Error('Missing 512px PNG icon.');
          if (!icons.some((icon) => icon.sizes === '512x512' && icon.purpose === 'maskable')) throw new Error('Missing maskable icon.');
          NODE

          docker compose exec -T app sh -lc '
            test -f /app/public/pcc-sw.js
            test -f /app/public/offline-capture.html
            test -f /app/public/offline-capture.js
          '

          curl --fail --silent --show-error --dump-header pwa-static-worker.headers --output pwa-static-worker.js http://127.0.0.1:3000/pcc-sw.js
          grep -Eqi '^content-type:.*javascript' pwa-static-worker.headers
          grep -Eq 'pcc-offline-capture-v[0-9]+' pwa-static-worker.js
          grep -q '/offline-capture.html' pwa-static-worker.js

          curl --fail --silent --show-error --dump-header pwa-static-script.headers --output pwa-static-script.js http://127.0.0.1:3000/offline-capture.js
          grep -Eqi '^content-type:.*javascript' pwa-static-script.headers
          grep -q 'pcc-offline-captures-v1' pwa-static-script.js

          curl --fail --silent --show-error --dump-header pwa-static-page.headers --output pwa-static-page.html http://127.0.0.1:3000/offline-capture.html
          grep -Eqi '^content-type:.*text/html' pwa-static-page.headers
          grep -q 'Offline capture' pwa-static-page.html

          for size in 192 512; do
            curl --fail --silent --show-error --dump-header "pwa-icon-$size.headers" --output "pwa-icon-$size.png" "http://127.0.0.1:3000/api/pwa-icon/$size"
            grep -qi '^content-type: image/png' "pwa-icon-$size.headers"
            python3 - "$size" <<'PY'
          import struct
          import sys

          size = int(sys.argv[1])
          with open(f"pwa-icon-{size}.png", "rb") as icon_file:
              header = icon_file.read(24)
          if header[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Generated icon is not a PNG.")
          width, height = struct.unpack(">II", header[16:24])
          if (width, height) != (size, size):
              raise SystemExit(f"Generated icon is {width}x{height}, expected {size}x{size}.")
          PY
          done

          docker compose run --rm backup --once
          latest_dump="$(find data/backups -maxdepth 1 -type f -name 'personal-control-center-*.dump' -size +0c | sort | tail -n 1)"
          latest_uploads="$(find data/backups -maxdepth 1 -type f -name 'personal-control-center-*.uploads.tar.gz' -size +0c | sort | tail -n 1)"
          test -n "$latest_dump"
          test -n "$latest_uploads"
          docker compose exec -T backup pg_restore --list "/backups/$(basename "$latest_dump")" >/dev/null
          tar -tzf "$latest_uploads" > upload-archive.list
          grep -Eq '^\./[^/]+/review-photos/[0-9a-f-]{36}$' upload-archive.list

          docker compose exec -T backup createdb -h postgres -U pcc keychain_restore_test
          docker compose exec -T backup pg_restore -h postgres -U pcc -d keychain_restore_test --no-owner --no-privileges "/backups/$(basename "$latest_dump")"
          test "$(docker compose exec -T backup psql -h postgres -U pcc -d keychain_restore_test -Atc "select count(*) from keychain_vaults where master_ciphertext = repeat('J', 64)")" = "1"
          test "$(docker compose exec -T backup psql -h postgres -U pcc -d keychain_restore_test -Atc "select count(*) from keychain_records where ciphertext = repeat('K', 48) and revision = 7")" = "1"
          docker compose exec -T backup dropdb -h postgres -U pcc keychain_restore_test

          docker compose run --rm --no-deps --entrypoint /bin/sh backup /usr/local/bin/pcc-offsite status | grep -q 'R2 off-site backups are disabled'

      - name: Upload Compose failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-validation-log
          path: compose-validation.log
          if-no-files-found: ignore

  validate:
    name: Validate
    if: always()
    needs:
      - quality
      - production_stack
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm required jobs succeeded
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PRODUCTION_STACK_RESULT: ${{ needs.production_stack.result }}
        run: |
          set -eu
          test "$QUALITY_RESULT" = "success"
          case "$EVENT_NAME" in
            pull_request|workflow_dispatch)
              test "$PRODUCTION_STACK_RESULT" = "success"
              ;;
            push)
              test "$PRODUCTION_STACK_RESULT" = "skipped"
              ;;
            *)
              echo "Unexpected event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
