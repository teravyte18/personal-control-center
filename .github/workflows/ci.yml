name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: personal_control_center
          POSTGRES_USER: pcc
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcc -d personal_control_center"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://pcc:ci-password@127.0.0.1:5432/personal_control_center
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test domain behavior
        run: npm test

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Validate shared server persistence
        run: |
          npm start > /tmp/personal-control-center.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true; cat /tmp/personal-control-center.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          node --test tests/server-persistence.test.mjs
