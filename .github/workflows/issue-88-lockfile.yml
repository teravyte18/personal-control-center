name: Regenerate sharp lockfile for issue 88

on:
  push:
    branches:
      - fix/issue-88-sharp-security

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Regenerate complete cross-platform npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          node -e "const p=require('./package-lock.json').packages; if(p['node_modules/sharp']?.version!=='0.35.5') process.exit(1); for(const n of ['@img/sharp-linux-arm64','@img/sharp-libvips-linux-arm64','@img/sharp-linux-x64','@img/sharp-libvips-linux-x64']) if(!p['node_modules/'+n]) {console.error('Missing '+n);process.exitCode=1}"
          npm audit --omit=dev --audit-level=high
      - name: Commit npm-generated lock and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/issue-88-lockfile.yml
          git add package-lock.json .github/workflows/issue-88-lockfile.yml
          git commit -m "fix(deps): regenerate patched sharp lockfile (#88)"
          git push
