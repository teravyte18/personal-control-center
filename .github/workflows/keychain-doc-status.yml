name: Finalize Keychain Stage 3 docs

on:
  push:
    branches:
      - agent/keychain-stage-3
    paths:
      - .github/workflows/keychain-doc-status.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/keychain-stage-3
          fetch-depth: 0
      - name: Update Keychain status
        shell: python
        run: |
          from pathlib import Path
          path = Path("docs/password-keychain.md")
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new)

          replace_once(
              "The first release is an **experimental encrypted secrets vault**, not a claim to replace a mature audited password manager. Important credentials should not rely on it as their only copy until the implementation has received an independent security review.",
              "The first release is a **client-encrypted secrets vault** with documented residual risks, not a claim to replace a mature independently audited password manager. An independent review remains a recommended external assurance step rather than something the implementation author can self-certify."
          )
          replace_once(
              "Stages 1 and 2 are implemented in PRs #55 and #56 and remain experimental pending Stage 3. The current implementation includes dedicated ciphertext-only persistence, Argon2id/XChaCha20-Poly1305 browser cryptography, recovery-key wrapping, authenticated user/record/revision binding, setup/unlock/recovery/password-change flows, encrypted record CRUD, search, deliberate copy/reveal, fixed lock timers, and a CSPRNG password generator.\n\nCI covers cryptographic wrong-key/tamper/swap failures, source-level plaintext/storage boundaries, and live PostgreSQL/API user isolation. Stage 3 still gates use as the sole copy of important credentials and includes CSP/XSS review, dependency review, encrypted export and restore rehearsal, vault-key rotation, and independent security review.",
              "Stages 1, 2, and the implementation-side Stage 3 hardening are complete in PRs #55, #56, and #58. The implementation includes ciphertext-only persistence, Argon2id/XChaCha20-Poly1305 browser cryptography, recovery-key wrapping, authenticated user/record/revision binding, setup/unlock/recovery/password-change flows, encrypted record CRUD, search, deliberate copy/reveal, fixed lock timers, a CSPRNG password generator, encrypted export/restore, atomic vault-key rotation, route hardening, dependency auditing, and backup/restore rehearsal.\n\nCI covers cryptographic wrong-key/tamper/swap failures, source-level plaintext/storage boundaries, live PostgreSQL/API user isolation, same-origin write enforcement, production dependency auditing, security headers, and restoring synthetic Keychain ciphertext from the normal PostgreSQL backup. The remaining independent professional review is external assurance, not unfinished implementation work."
          )
          replace_once(
              "- Rotating the vault key is a separate maintenance operation that re-encrypts every record and must be resumable and tested.",
              "- Rotating the vault key is a separate maintenance operation that re-encrypts every record locally and commits the complete ciphertext set atomically; failed or stale commits leave the previous vault unchanged."
          )
          replace_once(
              "- A future Keychain export must remain encrypted and use its own versioned format.",
              "- Keychain export uses its own versioned encrypted format and is validated locally before restore."
          )
          replace_once(
              "- independent security review;\n- explicit decision on whether the experimental warning may be removed.",
              "- independent security review as an external follow-up;\n- explicit production-use decision and residual-risk documentation."
          )
          replace_once(
              "- the UI states the server-compromise and unrecoverable-loss boundaries honestly.",
              "- recovery setup communicates unrecoverable loss clearly, while the detailed server-compromise and review boundaries remain documented in `docs/keychain-security-review.md` rather than permanently occupying the app UI."
          )

          path.write_text(text)
      - name: Commit documentation status
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/password-keychain.md
          git commit -m "docs: mark Keychain implementation hardening complete"
          git push origin HEAD:agent/keychain-stage-3
