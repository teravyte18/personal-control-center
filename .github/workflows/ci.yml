name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test domain behavior
        run: npm test

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-compose-password
        run: docker compose config --quiet

      - name: Validate production Compose persistence
        env:
          POSTGRES_PASSWORD: ci-compose-password
        run: |
          trap 'docker compose logs; docker compose down --volumes --remove-orphans' EXIT
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          node --test tests/server-persistence.test.mjs
