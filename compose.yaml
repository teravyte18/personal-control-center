name: personal-control-center

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_control_center
      POSTGRES_USER: pcc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcc -d personal_control_center"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: .
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://pcc:${POSTGRES_PASSWORD}@postgres:5432/personal_control_center
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://pcc:${POSTGRES_PASSWORD}@postgres:5432/personal_control_center
      UPLOAD_ROOT: /data/uploads
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
