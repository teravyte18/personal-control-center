name: Finalize Keychain Stage 2

on:
  push:
    branches:
      - agent/keychain-stage-2
    paths:
      - .github/workflows/keychain-stage2-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/keychain-stage-2
          fetch-depth: 0

      - name: Mask secrets in the credential editor
        shell: python
        run: |
          from pathlib import Path

          page = Path("src/app/keychain/page.tsx")
          text = page.read_text()
          old_state = '''  const [generatorOpen, setGeneratorOpen] = useState(false);\n  const [generator, setGenerator] = useState<KeychainPasswordGeneratorOptions>({ ...defaultKeychainPasswordGeneratorOptions });'''
          new_state = '''  const [generatorOpen, setGeneratorOpen] = useState(false);\n  const [passwordVisible, setPasswordVisible] = useState(false);\n  const [generator, setGenerator] = useState<KeychainPasswordGeneratorOptions>({ ...defaultKeychainPasswordGeneratorOptions });'''
          if old_state not in text:
              raise SystemExit("Record editor state block did not match expected source")
          text = text.replace(old_state, new_state, 1)

          old_input = '''          <input className="input min-w-0 flex-1 font-mono" type="text" value={editor.data.password} onChange={(event) => update("password", event.target.value)} maxLength={8192} autoComplete="off" spellCheck={false} />\n          <button type="button" onClick={() => setGeneratorOpen((current) => !current)} className="min-h-11 shrink-0 rounded-xl border border-slate-200 px-3 text-xs font-semibold text-slate-700">Generate</button>'''
          new_input = '''          <input className="input min-w-0 flex-1 font-mono" type={passwordVisible ? "text" : "password"} value={editor.data.password} onChange={(event) => update("password", event.target.value)} maxLength={8192} autoComplete="off" spellCheck={false} />\n          <button type="button" onClick={() => setPasswordVisible((current) => !current)} className="min-h-11 shrink-0 rounded-xl border border-slate-200 px-3 text-xs font-semibold text-slate-700">{passwordVisible ? "Hide" : "Show"}</button>\n          <button type="button" onClick={() => setGeneratorOpen((current) => !current)} className="min-h-11 shrink-0 rounded-xl border border-slate-200 px-3 text-xs font-semibold text-slate-700">Generate</button>'''
          if old_input not in text:
              raise SystemExit("Record editor secret input did not match expected source")
          page.write_text(text.replace(old_input, new_input, 1))

      - name: Commit masked editor
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/keychain/page.tsx
          git commit -m "fix: mask Keychain secrets while editing"
          git push origin HEAD:agent/keychain-stage-2
