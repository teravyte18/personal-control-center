name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test domain behavior
        run: npm test

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-compose-password
          PCC_DEFAULT_USER_EMAIL: owner@example.test
          PCC_OWNER_BOOTSTRAP_PASSWORD: owner-bootstrap-password-123
          PCC_COOKIE_SECURE: 0
          PCC_ALLOW_INSECURE_USER_HEADER: 1
        run: docker compose config --quiet

      - name: Validate production Compose persistence and authentication
        env:
          POSTGRES_PASSWORD: ci-compose-password
          PCC_DEFAULT_USER_EMAIL: owner@example.test
          PCC_OWNER_BOOTSTRAP_PASSWORD: owner-bootstrap-password-123
          PCC_COOKIE_SECURE: 0
          PCC_ALLOW_INSECURE_USER_HEADER: 1
        run: |
          set -o pipefail
          touch compose-validation.log
          trap 'docker compose ps -a >> compose-validation.log 2>&1; docker compose logs >> compose-validation.log 2>&1; docker compose down --volumes --remove-orphans >> compose-validation.log 2>&1' EXIT
          docker compose up -d --build 2>&1 | tee -a compose-validation.log
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/api/health | tee -a compose-validation.log
          node --test tests/server-persistence.test.mjs 2>&1 | tee -a compose-validation.log

      - name: Upload Compose failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-validation-log
          path: compose-validation.log
          if-no-files-found: ignore
